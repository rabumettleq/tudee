name: Build iOS Simulator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug

      - name: Create Appetize ZIP
        working-directory: build/ios/iphonesimulator
        run: ditto -c -k --sequesterRsrc --keepParent Runner.app tudee-ios.zip

      - name: Save build file
        uses: actions/upload-artifact@v4
        with:
          name: tudee-ios-simulator
          path: build/ios/iphonesimulator/tudee-ios.zip
          if-no-files-found: error
          retention-days: 7