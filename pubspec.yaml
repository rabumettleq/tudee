name: tudee

description: "ToDo Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
     - assets/icons/
  fonts:
     - family: CherryBomb
       fonts:
        - asset: fonts/CherryBombOne-Regular.ttf
     - family: Inter
       fonts:
         - asset: fonts/Inter_18pt-Regular.ttf
           weight: 400
         - asset: fonts/Inter_18pt-Bold.ttf
           weight: 700
     - family: Nunito
       fonts:
         - asset: fonts/Nunito-Regular.ttf
           weight: 400
         - asset: fonts/Nunito-Medium.ttf
           weight: 500
         - asset: fonts/Nunito-SemiBold.ttf
           weight: 600
         - asset: fonts/Nunito-Bold.ttf
           weight: 700
